name: repave gates
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install repave-engine
        run: pip install "repave-engine==2.34.0"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "1.9.8"
      - name: Install Checkov
        run: pip install "checkov==3.2.366"
      - name: Install yamllint
        run: pip install yamllint
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: "3.14.4"
      - name: Install Conftest
        run: |
          CONFTEST_URL="https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz"
          curl -sSL "$CONFTEST_URL" | tar xz -C /usr/local/bin conftest
      - name: Install actionlint
        run: |
          curl -sSL \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin actionlint
      - name: Run golden path gates
        run: repave gates --path .
